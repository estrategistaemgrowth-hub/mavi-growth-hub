name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: avisa Bing/Copilot (base do ChatGPT Search), Yandex e cia. das URLs do sitemap.
      # Falha aqui não derruba o deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=c7e34bc784a0e561bcdecac019e01dff
          URLS=$(curl -fsSL https://www.agenciamavi.com.br/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' \
            -d "{\"host\":\"www.agenciamavi.com.br\",\"key\":\"$KEY\",\"keyLocation\":\"https://www.agenciamavi.com.br/$KEY.txt\",\"urlList\":$URLS}" \
            -w '%{http_code}\n'

